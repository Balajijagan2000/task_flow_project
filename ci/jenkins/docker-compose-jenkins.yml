services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: taskflow-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount host Docker socket so Jenkins can build container images
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount host kubeconfig so Jenkins can deploy to local Kubernetes
      - ${HOME:-/root}/.kube:/root/.kube:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    networks:
      - jenkins-network

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins-network:
    driver: bridge
