apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: taskflow-app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: taskflow-project
  source:
    repoURL: 'https://github.com/your-username/TaskFlow.git'
    targetRevision: HEAD
    path: deploy/kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: taskflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
